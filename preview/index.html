<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话寻踪 dsh-conv-search 实地预览</title>
<style>
  :root {
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-line-border: rgba(127, 127, 127, .22);
    --dsw-alias-label-primary: #111827;
    --dsw-alias-label-secondary: rgba(75, 85, 99, .9);
    --dsw-alias-label-tertiary: rgba(127, 127, 127, .7);
    --dsw-alias-interactive-bg-hover: rgba(127, 127, 127, .12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; color: var(--dsw-alias-label-primary); background: #f7f7f8; }
  header.app {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--dsw-alias-bg-base); border-bottom: 1px solid var(--dsw-alias-line-border);
  }
  header.app h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #header-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .toolbar { display: flex; gap: 8px; margin-left: 12px; }
  .toolbar button {
    border: 1px solid var(--dsw-alias-line-border); background: #fff; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  main { position: fixed; top: 56px; bottom: 0; left: 0; right: 0; display: flex; }
  [data-conversation-scroll] { flex: 1; overflow-y: auto; padding: 24px 12%; }
  .msg { background: #fff; border: 1px solid var(--dsw-alias-line-border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  .msg.user { background: #eef4ff; }
  .msg .role { font-size: 12px; color: var(--dsw-alias-label-tertiary); margin-bottom: 4px; }
  [data-composer-seat] {
    position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--dsw-alias-line-border);
    padding: 12px; margin-top: 8px;
  }
  [data-composer-seat] textarea { width: 100%; border: 1px solid var(--dsw-alias-line-border); border-radius: 10px; padding: 8px; font: inherit; resize: none; height: 56px; }
</style>
</head>
<body>
<header class="app">
  <h1>DeepSeek Harness（模拟）</h1>
  <div class="toolbar">
    <button id="btn-stream" type="button">模拟流式输出</button>
    <button id="btn-append" type="button">追加一条消息</button>
  </div>
  <div id="header-actions"></div>
</header>
<main>
  <div data-conversation-scroll>
    <div id="transcript"></div>
    <div data-composer-seat>
      <textarea placeholder="输入消息…（此处文本不应被搜索命中）"></textarea>
    </div>
  </div>
</main>

<script src="/node_modules/react/umd/react.production.min.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script>
  // ---- seed transcript with realistic content ----
  const transcript = document.getElementById('transcript')
  const seed = [
    ['user', '请介绍一下 DeepSeek Harness 的插件体系。'],
    ['assistant', 'DeepSeek Harness 基于 Cordis 框架组织插件。每个插件通过 apply 函数挂载，使用 ctx.effect 注册可逆副作用。客户端插件声明 dsh.client，宿主扫描后生成启动图，浏览器通过 __ModuleLoader__ 注册工厂函数，首次 require 时物化。'],
    ['user', '那插槽（slots）系统是怎么工作的？'],
    ['assistant', '插槽系统允许插件向宿主 UI 的固定位置注入组件。例如 conversation.session.header.actions 插槽可以容纳会话头部的操作按钮。注册通过 ctx.slots.inject 等待声明出现，卸载时自动移除，保证零侵入。'],
    ['user', '搜索功能为什么用 CSS Custom Highlight API？'],
    ['assistant', '因为对话 DOM 由 React 管理并在流式输出期间持续重渲染。包裹 <mark> 会改动 React 管理的文本节点，破坏协调机制。Custom Highlight API 以覆盖层方式绘制 Range，不触碰 DOM 树，能安然度过每次重渲染，也无需清理。DeepSeek 的模型在长文本场景尤其需要这种无损高亮。'],
    ['user', '总结一下重点。'],
    ['assistant', '重点有三：其一，插件组合走 cordis 依赖注入而非静态导入；其二，UI 扩展走插槽而非改核心；其三，浏览器端高亮走 CSS Custom Highlight API 而非 DOM 包裹。DeepSeek Harness 的设计哲学是零核心改动。'],
  ]
  for (const [role, text] of seed) {
    const div = document.createElement('div')
    div.className = 'msg ' + role
    const r = document.createElement('div')
    r.className = 'role'
    r.textContent = role === 'user' ? '用户' : '助手'
    div.appendChild(r)
    div.appendChild(document.createTextNode(text))
    transcript.appendChild(div)
  }

  // ---- streaming / append simulation ----
  let streamTimer = null
  document.getElementById('btn-stream').addEventListener('click', () => {
    if (streamTimer) { clearInterval(streamTimer); streamTimer = null; return }
    const div = document.createElement('div')
    div.className = 'msg assistant'
    div.innerHTML = '<div class="role">助手</div><span class="stream"></span>'
    transcript.appendChild(div)
    const target = div.querySelector('.stream')
    const text = '流式输出演示：DeepSeek 模型正在逐字生成内容，搜索高亮应当在 DOM 变化后自动重新同步，不丢失匹配计数，也不抢占滚动位置。'
    let i = 0
    streamTimer = setInterval(() => {
      i += 2
      target.textContent = text.slice(0, i)
      if (i >= text.length) { clearInterval(streamTimer); streamTimer = null }
    }, 90)
  })
  document.getElementById('btn-append').addEventListener('click', () => {
    const div = document.createElement('div')
    div.className = 'msg user'
    div.textContent = '新增消息：deepseek 搜索测试 ' + new Date().toLocaleTimeString()
    transcript.appendChild(div)
  })

  // ---- module loader shim + plugin boot ----
  let registered = null
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      const module = { exports: {} }
      const require = (name) => {
        if (name === 'react') return window.React
        throw new Error('unexpected require: ' + name)
      }
      registered = { id, exports: factory.call(module, require) ?? module.exports }
    },
  }
</script>
<script src="/lib/client.js"></script>
<script>
  // ---- fake cordis client context driving the real bundle's apply() ----
  const disposers = []
  const headerActions = document.getElementById('header-actions')
  function renderInto(container, element) {
    if (window.ReactDOM.createRoot) {
      const root = window.ReactDOM.createRoot(container)
      root.render(element)
      return () => root.unmount()
    }
    window.ReactDOM.render(element, container)
    return () => window.ReactDOM.unmountComponentAtNode(container)
  }
  const ctx = {
    effect(fn) { const d = fn(); if (d) disposers.push(d) },
    slots: {
      inject(_name, cb) { const un = cb(); return () => un() },
      register(_options, component) {
        const container = document.createElement('div')
        headerActions.appendChild(container)
        const unmount = renderInto(container, React.createElement(component, { sessionId: 'preview-session' }))
        return () => { unmount(); container.remove() }
      },
    },
  }
  registered.exports.apply(ctx)
  window.__preview = { registered, ctx }
</script>
</body>
</html>
